<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EA">
<title>こどもべや | いいまちがい としょかん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="pencil" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main class="stage">
  <div id="status" class="status" aria-live="polite">ことりは おやすみちゅう</div>
  <button id="main" class="big" type="button">
    <img id="bird" src="/assets/ui/09-listening-bird.png" alt="" width="240" height="241">
    <span id="label" class="label">すたーと</span>
    <span class="notes" aria-hidden="true">♪</span>
  </button>
  <p id="hint" class="hint">おすと、ことりが おきるよ</p>
  <p id="note" class="note" aria-live="polite"></p>

  <!-- こまったとき: おうちのひとに電話（番号は、おうちのひとの画面で入れる。入っているときだけ出す） -->
  <a id="call" class="call" href="#" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" fill="currentColor"/></svg>
    おうちのひとに でんわ
  </a>

  <form id="demoForm" hidden class="row" style="width:100%;max-width:420px">
    <input id="demo" type="text" value="てびり みたいなー" aria-label="デモ用: 子どもが言った言葉" style="flex:1;min-width:0">
    <button class="ghost" type="submit">(TEST) おくる</button>
  </form>

  <a class="link" href="/museum.html">おうちのひと</a>
</main>

<script type="module">
import { recordCandidates, putClip, loadMuseum, loadTel, addRecording, nowLocal } from '/lib/store.js';
import { familyDictionary, telHref } from '/lib/mistakes.js';
// こまったときの「でんわ」ボタン（番号があるときだけ）
const callHref = telHref(loadTel());
if (callHref) { document.getElementById('call').href = callHref; document.getElementById('call').hidden = false; }
// この家の子がよく言う言葉（図書館に入った言葉＋既知の言い間違い）。Aqua へのヒントと、判定の辞書に使う
const familyWords = () => familyDictionary(loadMuseum()).map((d) => d.wrong);
const museumLite = () => loadMuseum().map(({ id, wrong, right, graduatedDate }) => ({ id, wrong, right, graduatedDate }));
const $ = (id) => document.getElementById(id);
const say = (el, t) => { el.textContent = t; };

const QUIET_MS = 1300, MIN_MS = 400, MAX_MS = 12000, IDLE_ROTATE_MS = 4000, LOUD = 8, LOUD_RMS = 3.2;
let stream, ctx, timer, activeRec = null, wake, stopping = false;
let speaking = false, speechStartedAt = 0, quietSince = 0, voiceTicks = 0;

const params = new URLSearchParams(location.search);
if (params.get('demo') === '1') $('demoForm').hidden = false; // マイクが使えない場面用（子どもには見せない）

function pickType() {
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

// 眠る鳥（待機）→ 起きて聞く鳥（スタート中）。声が聞こえると歌う（.hearing）
new Image().src = '/assets/ui/01-bird.png'; // 先に読み込んで、切り替えをすぐにする
function show(listening) {
  say($('label'), listening ? 'おわり' : 'すたーと');
  $('bird').src = listening ? '/assets/ui/01-bird.png' : '/assets/ui/09-listening-bird.png';
  $('main').classList.toggle('stop', listening);
  $('main').classList.remove('hearing');
  say($('status'), listening ? 'ことりが きいてるよ' : 'ことりは おやすみちゅう');
  say($('hint'), listening ? 'おわるときは おしてね' : 'おすと、ことりが おきるよ');
}

// 文字 → 言い間違いの候補 → お母さんの画面へ（子どもには結果を見せない）
async function deliver(text, clipId, segments = [], recordedAt = null) {
  try {
    const r = await fetch('/api/detect', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, segments, museum: museumLite() }) }).then((x) => x.json());
    if (!r.ok) throw new Error(r.error || '失敗');
    recordCandidates(r.candidates, { ...(recordedAt ? { at: recordedAt } : {}), clipId }); // お母さんの確認なしで、図書館と記録に入る
    say($('note'), r.candidates.length ? (recordedAt ? `${recordedAt.slice(11, 16)} に録音して おうちのひとに とどけたよ` : 'おうちのひとに とどけたよ') : (recordedAt ? `${recordedAt.slice(11, 16)} に録音しました` : ''));
    return r.candidates.length;
  } catch {
    say($('note'), recordedAt ? `${recordedAt.slice(11, 16)} に録音しました` : 'うまくいかなかったよ');
    return 0;
  }
}

async function onClip(blob, type) {
  if (!blob || !blob.size) return;
  const at = nowLocal();
  const hm = at.slice(11, 16);
  const clipId = `c-${Date.now()}`;
  await putClip(clipId, blob);
  addRecording({ id: clipId, at, clipId, text: '', matched: false });
  say($('note'), `${hm} に録音しました`);
  try {
    const resp = await fetch('/api/transcribe', { method: 'POST', headers: { 'content-type': 'application/octet-stream', 'x-audio-type': type || 'audio/webm', 'x-hint-words': encodeURIComponent(JSON.stringify(familyWords())) }, body: blob });
    if (resp.status === 422) return; // 文字起こし不可（短すぎ・雑音など）でも、録音日時と音声は通知に残す
    const r = await resp.json();
    if (!resp.ok || !r.ok) throw new Error(r.error || `エラー ${resp.status}`);
    if (r.text) {
      const hits = await deliver(r.text, clipId, r.segments, at);
      addRecording({ id: clipId, at, clipId, text: r.text, matched: hits > 0 });
    }
  } catch {
    say($('note'), `${hm} に録音しました`); // 文字起こしできなくても、録音記録と音声は通知に残す
  }
}

function releaseStream() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
}

// 頭切れ（「てびり」の「て」が消える）を防ぐため、待機中も先頭ヘッダ付きの録音を回し、無音のまま長くなったら切り替える
function armRecorder(preferredType) {
  if (!stream || stopping) return;
  const rec = new MediaRecorder(stream, preferredType ? { mimeType: preferredType } : undefined);
  const clipChunks = [];
  const state = { rec, startedAt: Date.now(), send: false, mime: preferredType || rec.mimeType || '' };
  activeRec = state;

  rec.ondataavailable = (e) => {
    if (e.data && e.data.size) {
      clipChunks.push(e.data);
      if (!state.mime && e.data.type) state.mime = e.data.type;
    }
  };
  rec.onstop = () => {
    if (activeRec === state) activeRec = null;
    const outType = (state.mime || rec.mimeType || 'audio/webm').split(';')[0].trim() || 'audio/webm';
    if (state.send && clipChunks.length) {
      const blob = new Blob(clipChunks, { type: outType });
      onClip(blob, outType);
    }
    if (stopping) releaseStream();
    else if (stream) armRecorder(preferredType);
  };
  rec.start();
}

function finishUtterance(manual = false) {
  if (!activeRec || activeRec.rec.state === 'inactive') return;
  const now = Date.now();
  const duration = now - speechStartedAt;
  activeRec.send = manual ? (now - activeRec.startedAt >= 300) : (speaking && voiceTicks >= 2 && duration >= MIN_MS);
  speaking = false;
  voiceTicks = 0;
  $('main').classList.remove('hearing');
  activeRec.rec.stop();
}

function tick(an, buf, preferredType) {
  if (!stream || stopping) return;
  an.getByteTimeDomainData(buf);
  let peak = 0, sq = 0;
  for (const v of buf) {
    const d = Math.abs(v - 128);
    if (d > peak) peak = d;
    sq += d * d;
  }
  const rms = Math.sqrt(sq / buf.length);
  const now = Date.now();

  if (peak > LOUD || rms > LOUD_RMS) {
    quietSince = now;
    if (!speaking) {
      speaking = true;
      speechStartedAt = now;
      voiceTicks = 0;
      $('main').classList.add('hearing');
      if (!activeRec) armRecorder(preferredType);
    }
    voiceTicks++;
  }

  if (speaking && (now - quietSince > QUIET_MS || now - speechStartedAt > MAX_MS)) {
    finishUtterance(false);
  } else if (!speaking && activeRec && now - activeRec.startedAt > IDLE_ROTATE_MS && activeRec.rec.state === 'recording') {
    activeRec.send = false;
    activeRec.rec.stop();
  }
}

async function start() {
  stopping = false;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { say($('note'), 'まいくを ゆるしてね'); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC();
  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch { /* ignore */ }
  }
  const an = ctx.createAnalyser(); an.fftSize = 512;
  ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.fftSize), type = pickType();
  armRecorder(type);
  timer = setInterval(() => tick(an, buf, type), 100);
  try { wake = await navigator.wakeLock?.request('screen'); } catch { /* 画面が消えても動く端末もある */ }
  say($('note'), ''); show(true);
}

function stop() {
  stopping = true;
  clearInterval(timer);
  const recState = activeRec?.rec?.state;
  if (activeRec && recState && recState !== 'inactive') {
    finishUtterance(true); // 停止直前まで話していた声も、onstop 完了後に送ってからマイクを閉じる
  } else {
    speaking = false; voiceTicks = 0;
    releaseStream();
  }
  ctx?.close().catch(() => {}); ctx = null;
  wake?.release?.(); wake = null;
  show(false);
}

$('main').onclick = () => (stream ? stop() : start());
$('demoForm').onsubmit = (e) => { e.preventDefault(); const t = $('demo').value.trim(); if (t) deliver(t, null); };
</script>
</body>
</html>
