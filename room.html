<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F7A6D">
<title>子ども部屋 | ことばの博物館</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>子ども部屋</h1>
    <nav><a href="/museum.html">お母さんの画面へ</a></nav>
  </div>

  <section class="card" aria-label="見守り">
    <div class="row" style="justify-content:space-between">
      <span class="pill"><span id="dot" class="dot"></span><span id="state">待機中</span></span>
      <button id="start">はじめる</button>
    </div>
    <p class="muted" style="margin:10px 0 8px">設置のときに、マイクの許可を1回だけお願いします。声が聞こえたときだけ録音し、お母さんが決めるまで何も残りません。</p>
    <div class="meter" aria-hidden="true"><i id="level"></i></div>
  </section>

  <section class="card" aria-live="polite">
    <h2>いま聞こえた言葉</h2>
    <div id="heard" class="heard muted">まだありません</div>
    <div id="result" class="muted"></div>
  </section>

  <section class="card">
    <h2>マイクが使えないとき（デモ用）</h2>
    <p class="muted" style="margin-top:0">子どもが言ったとおりに入力して送ると、同じ流れで確かめられます。</p>
    <div class="row">
      <input id="demo" type="text" value="てびり みたいなー" aria-label="子どもが言った言葉" style="flex:1;min-width:0">
      <button id="send" class="ghost">送る</button>
    </div>
  </section>
</main>

<script type="module">
import { addPending, putClip, today } from '/lib/store.js';
const $ = (id) => document.getElementById(id);
const say = (el, t) => { el.textContent = t; };

const QUIET_MS = 1500, MIN_MS = 600, MAX_MS = 10000, LOUD = 14;
let stream, ctx, timer, rec, chunks = [], speaking = false, startedAt = 0, quietSince = 0;

function pickType() {
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

function setState(text, mode) {
  say($('state'), text);
  $('dot').className = 'dot' + (mode ? ' ' + mode : '');
}

// 文字 → 言い間違いの候補 → お母さんの画面へ
async function deliver(text, clipId) {
  say($('heard'), text); $('heard').classList.remove('muted');
  say($('result'), '言い間違いを探しています…');
  try {
    const r = await fetch('/api/detect', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) }).then((x) => x.json());
    if (!r.ok) throw new Error(r.error || '失敗');
    const items = r.candidates.map((c, i) => ({ ...c, id: `p-${Date.now()}-${i}`, clipId, date: today(), text }));
    addPending(items);
    say($('result'), items.length ? `見つけました: ${items.map((c) => `${c.wrong}→${c.right}`).join('、')}。お母さんの画面に届けました。` : '言い間違いはありませんでした。');
  } catch (e) {
    say($('result'), '探せませんでした。もう一度お試しください。');
  }
}

async function onClip(blob, type) {
  setState('文字にしています', 'on');
  const clipId = `c-${Date.now()}`;
  await putClip(clipId, blob);
  try {
    const resp = await fetch('/api/transcribe', { method: 'POST', headers: { 'content-type': 'application/octet-stream', 'x-audio-type': type || 'audio/webm' }, body: blob });
    const r = await resp.json();
    if (!resp.ok || !r.ok) throw new Error(r.error || `エラー ${resp.status}`);
    if (r.text) await deliver(r.text, clipId); else say($('result'), '聞き取れませんでした。');
  } catch (e) {
    say($('result'), `文字にできませんでした（${e.message}）。下のデモ入力をお使いください。`);
  }
  if (stream) setState('聞いています', 'on');
}

function tick(an, buf, type) {
  an.getByteTimeDomainData(buf);
  let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
  $('level').style.width = Math.min(100, peak * 4) + '%';
  const now = Date.now();
  if (peak > LOUD) {
    quietSince = now;
    if (!speaking) {
      speaking = true; startedAt = now; chunks = [];
      rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onstop = () => { const len = Date.now() - startedAt; if (len >= MIN_MS) onClip(new Blob(chunks, { type: type || 'audio/webm' }), type); };
      rec.start(); setState('聞き取り中', 'rec');
    }
  }
  if (speaking && (now - quietSince > QUIET_MS || now - startedAt > MAX_MS)) {
    speaking = false; rec.stop(); setState('聞いています', 'on');
  }
}

$('start').onclick = async () => {
  if (stream) { // とめる
    stream.getTracks().forEach((t) => t.stop()); stream = null; clearInterval(timer); ctx?.close();
    setState('待機中'); say($('start'), 'はじめる'); $('level').style.width = '0'; return;
  }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { setState('マイクが許可されていません'); return; }
  ctx = new AudioContext();
  const an = ctx.createAnalyser(); an.fftSize = 512;
  ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.fftSize), type = pickType();
  timer = setInterval(() => tick(an, buf, type), 120);
  setState('聞いています', 'on'); say($('start'), 'とめる');
};

$('send').onclick = () => { const t = $('demo').value.trim(); if (t) deliver(t, null); };
$('demo').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('send').click(); });
</script>
</body>
</html>
