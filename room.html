<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EA">
<title>こどもべや | いいまちがい としょかん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<main class="stage">
  <div id="status" class="status" aria-live="polite">ことりは おやすみちゅう</div>
  <button id="main" class="big" type="button">
    <img id="bird" src="/assets/ui/09-listening-bird.png" alt="" width="240" height="241">
    <span id="label" class="label">すたーと</span>
    <span class="notes" aria-hidden="true">♪</span>
  </button>
  <p id="hint" class="hint">おすと、ことりが おきるよ</p>
  <p id="note" class="note" aria-live="polite"></p>

  <form id="demoForm" hidden class="row" style="width:100%;max-width:420px">
    <input id="demo" type="text" value="てびり みたいなー" aria-label="デモ用: 子どもが言った言葉" style="flex:1;min-width:0">
    <button class="ghost" type="submit">おくる</button>
  </form>

  <a class="link" href="/museum.html">おうちのひと</a>
</main>

<script type="module">
import { recordCandidates, putClip, loadMuseum } from '/lib/store.js';
import { familyDictionary } from '/lib/mistakes.js';
// この家の子がよく言う言葉（図書館に入った言葉＋既知の言い間違い）。Aqua へのヒントと、判定の辞書に使う
const familyWords = () => familyDictionary(loadMuseum()).map((d) => d.wrong);
const museumLite = () => loadMuseum().map(({ id, wrong, right, graduatedDate }) => ({ id, wrong, right, graduatedDate }));
const $ = (id) => document.getElementById(id);
const say = (el, t) => { el.textContent = t; };

const QUIET_MS = 1500, MIN_MS = 600, MAX_MS = 10000, LOUD = 14;
let stream, ctx, timer, rec, wake, chunks = [], speaking = false, startedAt = 0, quietSince = 0;

const params = new URLSearchParams(location.search);
if (params.get('demo') === '1') $('demoForm').hidden = false; // マイクが使えない場面用（子どもには見せない）

function pickType() {
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

// 眠る鳥（待機）→ 起きて聞く鳥（スタート中）。声が聞こえると歌う（.hearing）
new Image().src = '/assets/ui/01-bird.png'; // 先に読み込んで、切り替えをすぐにする
function show(listening) {
  say($('label'), listening ? 'おわり' : 'すたーと');
  $('bird').src = listening ? '/assets/ui/01-bird.png' : '/assets/ui/09-listening-bird.png';
  $('main').classList.toggle('stop', listening);
  $('main').classList.remove('hearing');
  say($('status'), listening ? 'ことりが きいてるよ' : 'ことりは おやすみちゅう');
  say($('hint'), listening ? 'おわるときは おしてね' : 'おすと、ことりが おきるよ');
}

// 文字 → 言い間違いの候補 → お母さんの画面へ（子どもには結果を見せない）
async function deliver(text, clipId, segments = []) {
  try {
    const r = await fetch('/api/detect', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, segments, museum: museumLite() }) }).then((x) => x.json());
    if (!r.ok) throw new Error(r.error || '失敗');
    recordCandidates(r.candidates, { clipId }); // お母さんの確認なしで、図書館と記録に入る
    say($('note'), r.candidates.length ? 'おうちのひとに とどけたよ' : '');
  } catch { say($('note'), 'うまくいかなかったよ'); }
}

async function onClip(blob, type) {
  const clipId = `c-${Date.now()}`;
  await putClip(clipId, blob);
  try {
    const resp = await fetch('/api/transcribe', { method: 'POST', headers: { 'content-type': 'application/octet-stream', 'x-audio-type': type || 'audio/webm', 'x-hint-words': encodeURIComponent(JSON.stringify(familyWords())) }, body: blob });
    const r = await resp.json();
    if (!resp.ok || !r.ok) throw new Error(r.error || `エラー ${resp.status}`);
    if (r.text) await deliver(r.text, clipId, r.segments);
  } catch { say($('note'), 'うまくいかなかったよ'); }
}

function tick(an, buf, type) {
  an.getByteTimeDomainData(buf);
  let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
  const now = Date.now();
  if (peak > LOUD) {
    quietSince = now;
    if (!speaking) {
      speaking = true; startedAt = now; chunks = [];
      rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onstop = () => { if (Date.now() - startedAt >= MIN_MS) onClip(new Blob(chunks, { type: type || 'audio/webm' }), type); };
      rec.start(); $('main').classList.add('hearing');
    }
  }
  if (speaking && (now - quietSince > QUIET_MS || now - startedAt > MAX_MS)) {
    speaking = false; rec.stop(); $('main').classList.remove('hearing');
  }
}

async function start() {
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { say($('note'), 'まいくを ゆるしてね'); return; }
  ctx = new AudioContext();
  const an = ctx.createAnalyser(); an.fftSize = 512;
  ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.fftSize), type = pickType();
  timer = setInterval(() => tick(an, buf, type), 120);
  try { wake = await navigator.wakeLock?.request('screen'); } catch { /* 画面が消えても動く端末もある */ }
  say($('note'), ''); show(true);
}

function stop() {
  if (speaking && rec) { speaking = false; rec.stop(); } // 話している途中でも、そこまでを残す
  stream?.getTracks().forEach((t) => t.stop()); stream = null;
  clearInterval(timer); ctx?.close(); wake?.release?.(); wake = null;
  show(false);
}

$('main').onclick = () => (stream ? stop() : start());
$('demoForm').onsubmit = (e) => { e.preventDefault(); const t = $('demo').value.trim(); if (t) deliver(t, null); };
</script>
</body>
</html>
